# --- HYPRLAND MASTER CONFIG ---
# This file is the orchestrator. It does not contain settings, only includes.

# 1. HARDWARE (Machine Specific)
source = ~/.config/hypr/hardware/monitors.conf
source = ~/.config/hypr/hardware/host-specific.conf
source = ~/.config/hypr/hardware/input.conf

# 2. CORE SYSTEM (Logic & Daemons)
# Variables (colors + other vars)
exec-once = cp -L --no-preserve=mode --update=none ~/.config/hypr/scheme/default.conf ~/.config/hypr/scheme/current.conf
source = ~/.config/hypr/scheme/current.conf
source = ~/.config/hypr/core/definitions.conf
source = ~/.config/hypr/core/env.conf
source = ~/.config/hypr/core/execs.conf
source = ~/.config/hypr/core/rules.conf
source = ~/.config/hypr/core/binds.conf

# 3. APPEARANCE (Theme, UI, Animations)
source = ~/.config/hypr/appearance/theme.conf
source = ~/.config/hypr/appearance/animations.conf
source = ~/.config/hypr/appearance/window_mods.conf
source = ~/.config/hypr/hardware/gestures.conf

# 4. KÖZÖS BEÁLLÍTÁSOK (a dotswitch overlay írja a shared/common.json-ből)
# Szándékosan UTOLSÓ, hogy felülírja a fentebbi profil-specifikus értékeket.
source = ~/.config/hypr/hardware/overlay.conf
