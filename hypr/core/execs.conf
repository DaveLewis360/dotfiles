# Keyring and auth
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Auto delete trash 30 days old
exec-once = trash-empty 30

# Cursors
exec-once = hyprctl setcursor sweet-cursors 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'sweet-cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# Location provider and night light
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = gammastep

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy

# Resize and move windows based on matches (e.g. pip)
exec-once = caelestia resizer -d

# Start shell and sync colors immediately
exec-once = caelestia shell -d
exec-once = python3 ~/dotfiles/scripts/update_css_vars.py
exec-once = ~/.config/caelestia/update_kdeglobals.sh
